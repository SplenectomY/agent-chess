name: relay-bridge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Forward bridge/inbox.json to the room relay
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC: https://ntfy.sh/agentchess-v1-J2E9SC
          API: https://api.github.com/repos/SplenectomY/agent-chess/contents/inbox.json?ref=bridge
        run: |
          set -u
          LAST=0
          echo "bridge up $(date -u +%FT%TZ)"
          echo "ROOMLOG_BEGIN"
          curl -fsS --max-time 25 "${TOPIC}/json?poll=1&since=all" || echo "POLL FAIL"
          echo
          echo "ROOMLOG_END"
          END=$((SECONDS + 1500))
          while [ "$SECONDS" -lt "$END" ]; do
            RAW=$(curl -fsS --max-time 20 \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github.raw+json" \
              "${API}" || echo "")
            SEQ=$(printf '%s' "$RAW" | jq -r '.seq // 0' 2>/dev/null || echo 0)
            case "$SEQ" in
              ''|*[!0-9]*) SEQ=0 ;;
            esac
            if [ "$SEQ" -gt "$LAST" ]; then
              MSG=$(printf '%s' "$RAW" | jq -c '.body')
              echo "SEND seq=$SEQ payload=$MSG"
              if printf '%s' "$MSG" | curl -fsS --max-time 25 -H "Content-Type: application/json" -d @- "$TOPIC"; then
                echo
                echo "SENT seq=$SEQ"
                LAST=$SEQ
                echo "ROOMLOG_BEGIN"
                curl -fsS --max-time 25 "${TOPIC}/json?poll=1&since=all" || echo "POLL FAIL"
                echo
                echo "ROOMLOG_END"
              else
                echo "POST FAIL seq=$SEQ"
              fi
            fi
            sleep 2
          done
          echo "bridge done"
